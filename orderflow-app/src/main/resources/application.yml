spring:
  application:
    name: orderflow

  datasource:
    url: jdbc:postgresql://localhost:5432/orderflow
    username: orderflow
    password: orderflow

  jpa:
    open-in-view: false      # почему выключаем — задача S.3
    hibernate:
      ddl-auto: validate     # схемой управляет только Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  kafka:
    bootstrap-servers: localhost:9092

  data:
    redis:
      host: localhost
      port: 6379

  mvc:
    problemdetails:
      enabled: true          # ошибки в формате RFC 9457

orderflow:
  payment-provider:
    base-url: http://localhost:8089   # WireMock из docker-compose; биндинг в @ConfigurationProperties — задача 0.2

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always   # только для локальной разработки
